services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: recruitment
      POSTGRES_USER: recruitment
      POSTGRES_PASSWORD: recruitment
    ports:
      - "5432:5432"
    volumes:
      - recruitment_postgres_data:/var/lib/postgresql/data
  adminer:
    image: adminer:4
    ports:
      - "8080:8080"

volumes:
  recruitment_postgres_data:
